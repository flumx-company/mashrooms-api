version: "3.8"
services:
  mashrooms-mysql:
    container_name: ${APP_NAME}-mysql-${APP_ENV}
    restart: always
    image: 'mysql:8.2.0'
    ports:
      - ${MYSQL_TCP_PORT}:3306
    env_file: 
      - .env
    networks:
      - registry_default
    volumes:
      - mashrooms-mysql-volume:/var/lib/mysql
      - ./deploy:/etc/mysql/mysql.conf.d
      - ./deploy/mysqld.cnf:/etc/mysql/mysql.conf.d/mysqld.cnf
    command: [ 'mysqld', '--default-time-zone=+00:00' ]
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 30

  mashrooms-phpmyadmin:
    image: "phpmyadmin/phpmyadmin:latest"
    restart: always
    ports:
      - 51515:80
    env_file: 
      - .env
    environment:
      UPLOAD_LIMIT: 64M
    depends_on:
      - mashrooms-mysql
    links: 
      - mashrooms-mysql
    networks:
      - registry_default
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mashrooms-phpmyadmin.rule=Host(`${API_PHPMYADMIN_DOMAIN_NAME}`) && PathPrefix(`/`)'
      - 'traefik.http.routers.mashrooms-phpmyadmin.entrypoints=websecure'
      - 'traefik.http.routers.mashrooms-phpmyadmin.tls.certresolver=myresolver'
      - 'traefik.http.routers.mashrooms-phpmyadmin.service=mashrooms-phpmyadmin'
      - 'traefik.http.services.mashrooms-phpmyadmin.loadbalancer.server.port=80'

  api:
    build: '.'
    env_file: 
      - .env
    environment:
      # В Docker хост MySQL — имя сервиса из этого compose (не из .env)
      MYSQL_NODE_HOSTNAME: mashrooms-mysql
    depends_on:
      mashrooms-mysql:
        condition: service_healthy
    links: 
      - mashrooms-mysql
    ports:
      - 51516:3000
    restart: always
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${API_DOMAIN_NAME}`) && PathPrefix(`/`)'
      - 'traefik.http.routers.api.entrypoints=websecure'
      - 'traefik.http.routers.api.tls.certresolver=myresolver'
      - 'traefik.http.routers.api.service=api'
      - 'traefik.http.services.api.loadbalancer.server.port=3000'
    networks:
      - registry_default

  mashrooms-redis:
    container_name: ${APP_NAME}-redis-${APP_ENV}
    image: "redis:latest"
    restart: always
    env_file: .env
    ports:
      - "51527:6379"
      - "51528:6380"
    networks:
      - registry_default
      # - mashrooms-network

  mashrooms-minio:
    container_name: "${APP_NAME}-minio-${APP_ENV}"
    image: minio/minio
    restart: always
    volumes:
      - mashrooms-minio-data:/minio-data
    command: 'minio server /minio-data --console-address ":9001"'
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-storage.rule=Host(${APP_MINIO_STORAGE_HOST_NAME}) && PathPrefix(/)"
      - "traefik.http.routers.minio-storage.entrypoints=websecure"
      - "traefik.http.routers.minio-storage.tls=true"
      - "traefik.http.routers.minio-storage.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-storage.service=minio-storage-service"
      - "traefik.http.services.minio-storage-service.loadbalancer.server.port=9000"

      - "traefik.http.routers.minio-browser.rule=Host(${APP_MINIO_BROWSER_HOST_NAME}) && PathPrefix(/)"
      - "traefik.http.routers.minio-browser.entrypoints=websecure"
      - "traefik.http.routers.minio-browser.tls=true"
      - "traefik.http.routers.minio-browser.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-browser.service=minio-browser-service"
      - "traefik.http.services.minio-browser-service.loadbalancer.server.port=9001"
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:9001/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - '51525:9000'
      - '51526:9001'
    networks:
      - registry_default

volumes:
  mashrooms-api-volume:
  mashrooms-mysql-volume:
  mashrooms-phpmyadmin-volume:
  mashrooms-minio-data:
  
networks:
  registry_default:
    external: true
